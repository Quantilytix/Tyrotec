# Render Blueprint for the Tyrotec backend: the API web service and the two
# reservation cron jobs. (The React frontend is hosted on Vercel -- see
# frontend/vercel.json.)
#
# Each service sets rootDir: backend, so commits that only touch frontend/ or
# docs/ don't trigger backend deploys.
#
# Apply it from the Render Dashboard: New > Blueprint > pick this repo.
# Render asks for every `sync: false` value while creating the Blueprint --
# those are secrets or deployment-specific URLs and deliberately never live in
# this file. The cron jobs ask for their own copies of the values they need;
# Blueprints can't put secrets in a shared environment group.
#
# region can't be changed after a service is created. Pick the Render region
# closest to the Supabase project's region (Supabase Dashboard > Project
# Settings > General), e.g. eu-central-1 -> frankfurt.

envVarGroups:
  # Non-secret settings shared by all three services. Values set here win on
  # every Blueprint sync, so change them in this file, not the Dashboard.
  - name: tyrotec-backend-settings
    envVars:
      - key: PAYFAST_MODE
        value: sandbox # switch to `live` at go-live, together with live PayFast credentials
      - key: ADMIN_REVIEW_THRESHOLD
        value: "50000"
      - key: RESERVATION_EXPIRY_MINUTES
        value: "60"
      - key: RESERVATION_WARNING_LEAD_MINUTES
        value: "10"

services:
  - type: web
    name: tyrotec-api
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: tyrotec-backend-settings
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Public URL of this service, e.g. https://tyrotec-api.onrender.com
      # (no trailing slash). PayFast's notify_url is built from it.
      - key: BACKEND_URL
        sync: false
      # Public URL of the Vercel frontend (no trailing slash). Password-reset
      # emails link to it.
      - key: FRONTEND_URL
        sync: false
      # Browser origins allowed to call the API, comma-separated -- normally
      # just the frontend URL.
      - key: CORS_ORIGINS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      # Must match the passphrase set on the PayFast merchant account exactly
      # (or be left empty if that account has none), or every checkout and
      # every ITN signature check fails.
      - key: PAYFAST_PASSPHRASE
        sync: false
      # Frontend orders page, e.g. https://<frontend>/orders
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  # Warns customers shortly before an unpaid fast-checkout reservation expires.
  # Runs on the 5-minute marks, a minute ahead of the release job below.
  - type: cron
    name: tyrotec-warn-expiring-reservations
    runtime: node
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "*/5 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node src/jobs/warnExpiringReservations.js
    envVars:
      - fromGroup: tyrotec-backend-settings
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false

  # Cancels unpaid fast-checkout orders whose reservation has expired, restores
  # their stock, and notifies the customer.
  - type: cron
    name: tyrotec-release-expired-reservations
    runtime: node
    region: frankfurt
    branch: main
    rootDir: backend
    schedule: "1-59/5 * * * *"
    buildCommand: npm ci --omit=dev
    startCommand: node src/jobs/releaseExpiredReservations.js
    envVars:
      - fromGroup: tyrotec-backend-settings
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
