# Render Blueprint for Tyrotec Portal on Render's Free plan: the React
# frontend (static site) and the API (free web service).
#
# Free-plan trade-offs, and what the app does about them:
# - No Cron Jobs: the API runs the reservation warning/release jobs itself
#   every 5 minutes (RUN_JOBS_IN_PROCESS below; backend/src/jobs/inProcessScheduler.js).
# - The API spins down after 15 minutes without traffic and takes about a
#   minute to wake. An external uptime monitor pinging /health keeps it awake.
# - Outbound SMTP ports (25, 465, 587) are blocked, so email is sent through
#   Brevo's HTTPS API instead (BREVO_API_KEY below).
# Moving to a paid plan: see "Upgrading from the Free plan" in README.md.
#
# The API sets rootDir: backend and the frontend a buildFilter on frontend/**,
# so each side only rebuilds when its own code changes.
#
# Default service URLs are https://<name>.onrender.com -- tyrotec-portal and
# tyrotec-api below -- unless Render appends a suffix because a name is taken.
#
# Apply it from the Render Dashboard: New > Blueprint > pick this repo.
# Render asks for every `sync: false` value while creating the Blueprint --
# those are secrets or deployment-specific URLs and deliberately never live in
# this file.

services:
  # Customer and admin portal (Vite build served from Render's CDN).
  - type: web
    name: tyrotec-portal
    runtime: static
    branch: main
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - frontend/**
    # Single-page app: every path must serve index.html so React Router can
    # pick the page. Without this, refreshing /orders or /admin/payments --
    # or PayFast's return redirect to /orders -- shows Render's "Not Found".
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    # Compiled into the JavaScript bundle at build time: after changing any of
    # these, trigger a new deploy of this site.
    envVars:
      # Backend URL plus /api, e.g. https://tyrotec-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      # The Supabase *anon* (public) key -- never the service-role key.
      - key: VITE_SUPABASE_ANON_KEY
        sync: false

  - type: web
    name: tyrotec-api
    runtime: node
    plan: free
    # Closest Render region to the Supabase project (eu-west-1, Ireland).
    # Can't be changed after the service is created.
    region: frankfurt
    branch: main
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      # No Cron Jobs on the Free plan, so the API runs the reservation jobs.
      # Set to "false" if the jobs are ever moved to Render Cron Jobs.
      - key: RUN_JOBS_IN_PROCESS
        value: "true"
      - key: PAYFAST_MODE
        value: sandbox # switch to `live` at go-live, together with live PayFast credentials
      - key: ADMIN_REVIEW_THRESHOLD
        value: "50000"
      - key: RESERVATION_EXPIRY_MINUTES
        value: "60"
      - key: RESERVATION_WARNING_LEAD_MINUTES
        value: "10"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Public URL of this service, e.g. https://tyrotec-api.onrender.com
      # (no trailing slash). PayFast's notify_url is built from it.
      - key: BACKEND_URL
        sync: false
      # Public URL of the frontend static site, e.g.
      # https://tyrotec-portal.onrender.com (no trailing slash).
      # Password-reset emails link to it.
      - key: FRONTEND_URL
        sync: false
      # Browser origins allowed to call the API, comma-separated -- normally
      # just the frontend URL.
      - key: CORS_ORIGINS
        sync: false
      # Email goes through Brevo's HTTPS API, since the Free plan blocks SMTP.
      - key: BREVO_API_KEY
        sync: false
      # Verified Brevo sender, e.g. Tyrotec <sales@tyrotec.co.za>
      - key: EMAIL_FROM
        sync: false
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      # Must match the passphrase set on the PayFast merchant account exactly
      # (or be left empty if that account has none), or every checkout and
      # every ITN signature check fails.
      - key: PAYFAST_PASSPHRASE
        sync: false
      # Frontend orders page, e.g. https://<frontend>/orders
      - key: PAYFAST_RETURN_URL
        sync: false
      - key: PAYFAST_CANCEL_URL
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
